<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ISOPOD LAB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">COLLECT · RESEARCH · GROW</div>
        <h1>ISOPOD LAB</h1>
      </div>
      <div class="gold">🪙 <span id="goldValue">0</span> G</div>
    </header>

    <section id="terrarium" class="terrarium">
      <div class="glass-shine"></div>
      <div id="isopodStage" class="isopod-stage"></div>
      <div class="soil"></div>
      <div class="leaf leaf-a">🍂</div>
      <div class="leaf leaf-b">🍁</div>
      <div class="mushroom">🍄</div>
    </section>

    <nav class="tabs">
      <button data-view="home" class="active">테라리움</button>
      <button data-view="explore">탐험</button>
      <button data-view="capsule">캡슐</button>
      <button data-view="codex">도감</button>
      <button data-view="equipment">장비</button>
    </nav>

    <section id="panel" class="panel"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div id="modalBody"></div>
      <button id="modalClose" class="primary">확인</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
