<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111612" />
  <title>ISOPOD LAB v0.2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">COLLECT · RESEARCH · GROW</div>
        <h1>ISOPOD LAB</h1>
      </div>
      <div class="top-actions">
        <div class="gold">🪙 <span id="goldValue">0</span> G</div>
        <button id="settingsButton" class="icon-button" aria-label="설정 열기" title="설정">⚙️</button>
      </div>
    </header>

    <section id="terrarium" class="terrarium">
      <div class="glass-shine"></div>
      <div id="isopodStage" class="isopod-stage"></div>
      <div class="soil"></div>
      <div class="leaf leaf-a">🍂</div>
      <div class="leaf leaf-b">🍁</div>
      <div class="mushroom">🍄</div>
      <div id="autoBadge" class="auto-badge hidden">AUTO</div>
    </section>

    <nav class="tabs">
      <button data-view="home" class="active">테라리움</button>
      <button data-view="explore">탐험</button>
      <button data-view="capsule">캡슐</button>
      <button data-view="codex">도감</button>
      <button data-view="equipment">장비</button>
    </nav>

    <section id="panel" class="panel"></section>
    <footer>ISOPOD LAB <span id="versionText">v0.2</span></footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="modalBody"></div>
      <button id="modalClose" class="primary modal-ok">확인</button>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="settingsDrawer" class="settings-drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><div class="eyebrow">SYSTEM</div><h2>설정</h2></div>
      <button id="settingsClose" class="icon-button" aria-label="설정 닫기">✕</button>
    </div>
    <div id="settingsBody"></div>
  </aside>

  <script src="main.js"></script>
</body>
</html>
